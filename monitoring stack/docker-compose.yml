name: learningdocker

services:
  webserver:
    image: nginx:latest
    ports:
    - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - monitoring

  webapp:
    image: test:latest
    networks:
      - monitoring
  
  grafana:
    image: grafana/grafana
    environment:
      - GF_SERVER_ROOT_URL=http://localhost:8080/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./configs/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus
    volumes:
    - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring

volumes:
  vhosts:
  grafana-storage:

networks:
  monitoring:
